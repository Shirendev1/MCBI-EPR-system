version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcbi
      POSTGRES_PASSWORD: mcbi_pass
      POSTGRES_DB: mcbi
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcbi -d mcbi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
